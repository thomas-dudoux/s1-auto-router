[project]
name = "s1-auto-router"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "decider-ai[metal]>=1.9.0",
    "mlx-lm>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# This HTTP boundary returns 500 for unexpected inference errors, without logging prompts.
"s1/daemon.py" = ["BLE001"]
